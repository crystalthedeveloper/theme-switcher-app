<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Switcher Extension</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 20px;
      }
      p {
        margin: 0 0 16px 0;
        line-height: 1.5;
      }
      button {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        background: #111827;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
      }
      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <h1>Theme Switcher</h1>
    <p>Add the Theme Switcher script to this project’s head. Click below to enable (idempotent; skips duplicates).</p>
    <button id="enable">Enable Theme Switcher</button>
    <div id="status">Ready</div>

    <script src="extension.js"></script>
  </body>
</html>
